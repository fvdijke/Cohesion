<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2f36"/><stop offset="1" stop-color="#15171b"/></linearGradient>
    <radialGradient id="kg" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#3a4149"/><stop offset="1" stop-color="#1b1f24"/></radialGradient>
    <symbol id="kn" overflow="visible">
      <circle r="17" fill="url(#kg)" stroke="#11161b" stroke-width="2"/><circle r="17" fill="none" stroke="#2b3138"/>
      <line x1="0" y1="0" x2="-8.5" y2="-13" stroke="#39ffb0" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1120" height="700" rx="10" fill="url(#bg)"/>
  <rect x="6" y="6" width="1108" height="688" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- header -->
  <text x="26" y="40" fill="#ffffff" font-size="18" font-weight="bold" letter-spacing="2.4">COHESION - SYNTH</text>
  <text x="26" y="58" fill="#ffffff" fill-opacity="0.55" font-size="11" letter-spacing="1">by Pepperwood</text>
  <text x="560" y="24" fill="#9fb0aa" font-size="10" letter-spacing="1.4" text-anchor="middle">PRESET</text>
  <rect x="408" y="30" width="24" height="30" rx="5" fill="#0e1013" stroke="#2b3138"/><text x="420" y="50" fill="#9fe1cb" font-size="13" text-anchor="middle">&#8249;</text>
  <rect x="436" y="30" width="248" height="30" rx="5" fill="#0e1013" stroke="#2b3138"/><text x="560" y="50" fill="#eafff6" font-size="13" text-anchor="middle">LEAD — Hypersaw</text>
  <rect x="688" y="30" width="24" height="30" rx="5" fill="#0e1013" stroke="#2b3138"/><text x="700" y="50" fill="#9fe1cb" font-size="13" text-anchor="middle">&#8250;</text>
  <rect x="718" y="30" width="30" height="30" rx="5" fill="#0e1013" stroke="#2b3138"/><text x="733" y="50" fill="#9fe1cb" font-size="12" text-anchor="middle">&#128190;</text>
  <rect x="754" y="30" width="24" height="30" rx="5" fill="#0f6e56"/><text x="766" y="49" fill="#eafff6" font-size="11" text-anchor="middle" font-weight="bold">A</text>
  <rect x="780" y="30" width="24" height="30" rx="5" fill="#0e1013" stroke="#2b3138"/><text x="792" y="49" fill="#9fb0aa" font-size="11" text-anchor="middle" font-weight="bold">B</text>
  <text x="1010" y="34" fill="#9fb0aa" font-size="11" letter-spacing="1.2" text-anchor="end">MENU</text>
  <use href="#kn" x="1060" y="36"/><text x="1060" y="66" fill="#9fb0aa" font-size="9" text-anchor="middle">MAIN</text>
  <rect x="1090" y="18" width="6" height="40" rx="2" fill="#0e1013"/><rect x="1090" y="38" width="6" height="20" rx="2" fill="#39ffb0"/>

  <!-- tabs -->
  <g font-size="12" font-weight="bold" letter-spacing="1.2" text-anchor="middle">
    <rect x="248" y="78" width="150" height="34" rx="6" fill="#0e1013" stroke="#2b3138"/><text x="323" y="100" fill="#9fb0aa">OSC / MIX</text>
    <rect x="406" y="78" width="150" height="34" rx="6" fill="#0e1013" stroke="#2b3138"/><text x="481" y="100" fill="#9fb0aa">FILTER / MOD</text>
    <rect x="564" y="78" width="150" height="34" rx="6" fill="#0e1013" stroke="#2b3138"/><text x="639" y="100" fill="#9fb0aa">FX</text>
    <rect x="722" y="78" width="150" height="34" rx="6" fill="#0f6e56"/><text x="797" y="100" fill="#eafff6">ARP</text>
  </g>

  <!-- ===== top controls ===== -->
  <g transform="translate(12,122)">
    <rect width="1096" height="118" rx="7" fill="#0d0f12" stroke="#ffffff" stroke-opacity="0.08"/>
    <!-- ON -->
    <rect x="16" y="18" width="78" height="30" rx="6" fill="#0f6e56"/><circle cx="32" cy="33" r="5" fill="#39ffb0"/><text x="64" y="38" fill="#eafff6" font-size="12" font-weight="bold" text-anchor="middle">ON</text>
    <!-- pattern selector -->
    <text x="16" y="72" fill="#6c7a74" font-size="9" letter-spacing="1">PATTERN</text>
    <rect x="16" y="78" width="24" height="26" rx="5" fill="#0e1013" stroke="#2b3138"/><text x="28" y="96" fill="#9fe1cb" font-size="12" text-anchor="middle">&#8249;</text>
    <rect x="44" y="78" width="210" height="26" rx="5" fill="#0e1013" stroke="#2b3138"/><text x="149" y="96" fill="#eafff6" font-size="12" text-anchor="middle">Trance Gate 1/16</text>
    <rect x="258" y="78" width="24" height="26" rx="5" fill="#0e1013" stroke="#2b3138"/><text x="270" y="96" fill="#9fe1cb" font-size="12" text-anchor="middle">&#8250;</text>
    <!-- MODE -->
    <text x="120" y="24" fill="#6c7a74" font-size="9" letter-spacing="1">MODE</text>
    <rect x="120" y="30" width="162" height="28" rx="5" fill="#0e1013" stroke="#2b3138"/><text x="201" y="49" fill="#9fe1cb" font-size="12" text-anchor="middle">Up / Down  &#9662;</text>
    <!-- knobs -->
    <g text-anchor="middle">
      <use href="#kn" x="360" y="52"/><text x="360" y="84" fill="#9fb0aa" font-size="9">RATE</text><text x="360" y="100" fill="#9fe1cb" font-size="9">1/16</text>
      <use href="#kn" x="446" y="52"/><text x="446" y="84" fill="#9fb0aa" font-size="9">OCTAVES</text><text x="446" y="100" fill="#9fe1cb" font-size="9">2</text>
      <use href="#kn" x="532" y="52"/><text x="532" y="84" fill="#9fb0aa" font-size="9">GATE</text><text x="532" y="100" fill="#9fe1cb" font-size="9">70%</text>
      <use href="#kn" x="618" y="52"/><text x="618" y="84" fill="#9fb0aa" font-size="9">SWING</text><text x="618" y="100" fill="#9fe1cb" font-size="9">18%</text>
      <use href="#kn" x="704" y="52"/><text x="704" y="84" fill="#9fb0aa" font-size="9">RANDOM</text><text x="704" y="100" fill="#9fe1cb" font-size="9">12%</text>
    </g>
    <!-- sync / hold / tempo -->
    <rect x="770" y="24" width="70" height="26" rx="5" fill="#0f6e56"/><text x="805" y="42" fill="#eafff6" font-size="11" text-anchor="middle">SYNC</text>
    <rect x="770" y="56" width="70" height="26" rx="5" fill="#0e1013" stroke="#2b3138"/><text x="805" y="74" fill="#9fb0aa" font-size="11" text-anchor="middle">HOLD</text>
    <rect x="856" y="24" width="96" height="26" rx="5" fill="#0e1013" stroke="#2b3138"/><text x="904" y="42" fill="#9fe1cb" font-size="11" text-anchor="middle">LATCH</text>
    <text x="904" y="68" fill="#6c7a74" font-size="9" text-anchor="middle" letter-spacing="1">TEMPO</text>
    <rect x="856" y="74" width="96" height="30" rx="5" fill="#0a0c0f" stroke="#1c2127"/><text x="904" y="94" fill="#eafff6" font-size="13" text-anchor="middle">128.0 BPM</text>
    <!-- steps length -->
    <text x="1040" y="24" fill="#6c7a74" font-size="9" text-anchor="middle" letter-spacing="1">STEPS</text>
    <rect x="980" y="30" width="24" height="28" rx="5" fill="#0e1013" stroke="#2b3138"/><text x="992" y="49" fill="#9fe1cb" font-size="12" text-anchor="middle">&#8249;</text>
    <rect x="1008" y="30" width="64" height="28" rx="5" fill="#0a0c0f" stroke="#1c2127"/><text x="1040" y="49" fill="#eafff6" font-size="13" text-anchor="middle">16</text>
    <rect x="980" y="74" width="92" height="30" rx="5" fill="#0e1013" stroke="#2b3138"/><text x="1026" y="94" fill="#9fe1cb" font-size="11" text-anchor="middle">RANDOMIZE</text>
  </g>

  <!-- ===== step sequencer ===== -->
  <g transform="translate(12,250)">
    <rect width="1096" height="316" rx="7" fill="#0d0f12" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="16" y="26" fill="#5dcaa5" font-size="11" font-weight="bold" letter-spacing="1.4">STEP SEQUENCER — VELOCITY</text>
    <text x="1080" y="26" fill="#6c7a74" font-size="9" text-anchor="end">klik om stap aan/uit · sleep voor velocity</text>

    <!-- grid: 16 steps -->
    <!-- baseline at local y=250 ; bars grow up ; tops computed per step -->
    <g>
      <!-- group columns: left pad 22, col width 66, bar width 42 -->
      <!-- i=0 -->
      <g transform="translate(22,0)">
        <rect x="0" y="44" width="42" height="206" rx="4" fill="#0a0c0f" stroke="#1c2127"/>
        <rect x="0" y="90" width="42" height="160" rx="4" fill="#39ffb0" fill-opacity="0.8"/>
        <circle cx="21" cy="270" r="6" fill="#39ffb0"/><text x="21" y="292" fill="#9fb0aa" font-size="9" text-anchor="middle">1</text>
      </g>
      <g transform="translate(88,0)">
        <rect x="0" y="44" width="42" height="206" rx="4" fill="#0a0c0f" stroke="#1c2127"/>
        <rect x="0" y="180" width="42" height="70" rx="4" fill="#39ffb0" fill-opacity="0.8"/>
        <circle cx="21" cy="270" r="6" fill="#39ffb0"/><text x="21" y="292" fill="#9fb0aa" font-size="9" text-anchor="middle">2</text>
      </g>
      <g transform="translate(154,0)">
