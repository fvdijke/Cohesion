        <rect x="0" y="196" width="42" height="54" rx="4" fill="#39ffb0" fill-opacity="0.8"/>
        <circle cx="21" cy="270" r="6" fill="#39ffb0"/><text x="21" y="292" fill="#9fb0aa" font-size="9" text-anchor="middle">16</text>
      </g>
