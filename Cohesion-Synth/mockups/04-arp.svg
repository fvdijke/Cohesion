        <rect x="0" y="130" width="42" height="120" rx="4" fill="#39ffb0" fill-opacity="0.8"/>
        <circle cx="21" cy="270" r="6" fill="#39ffb0"/><text x="21" y="292" fill="#9fb0aa" font-size="9" text-anchor="middle">3</text>
      </g>
      <!-- i=3 playhead -->
      <g transform="translate(220,0)">
        <rect x="-2" y="40" width="46" height="214" rx="5" fill="#39ffb0" fill-opacity="0.08" stroke="#39ffb0" stroke-opacity="0.5"/>
        <rect x="0" y="60" width="42" height="190" rx="4" fill="#39ffb0"/>
        <circle cx="21" cy="270" r="6" fill="#eafff6"/><text x="21" y="292" fill="#eafff6" font-size="9" text-anchor="middle">4</text>
      </g>
      <g transform="translate(286,0)">
        <rect x="0" y="44" width="42" height="206" rx="4" fill="#0a0c0f" stroke="#1c2127"/>
        <rect x="0" y="168" width="42" height="82" rx="4" fill="#39ffb0" fill-opacity="0.8"/>
        <circle cx="21" cy="270" r="6" fill="#39ffb0"/><text x="21" y="292" fill="#9fb0aa" font-size="9" text-anchor="middle">5</text>
      </g>
      <g transform="translate(352,0)">
        <rect x="0" y="44" width="42" height="206" rx="4" fill="#0a0c0f" stroke="#1c2127"/>
        <rect x="0" y="110" width="42" height="140" rx="4" fill="#39ffb0" fill-opacity="0.8"/>
        <circle cx="21" cy="270" r="6" fill="#39ffb0"/><text x="21" y="292" fill="#9fb0aa" font-size="9" text-anchor="middle">6</text>
      </g>
      <!-- i=6 off -->
      <g transform="translate(418,0)">
        <rect x="0" y="44" width="42" height="206" rx="4" fill="#0a0c0f" stroke="#1c2127"/>
        <rect x="0" y="150" width="42" height="100" rx="4" fill="#2b3138"/>
        <circle cx="21" cy="270" r="6" fill="#2b3138" stroke="#4a5560"/><text x="21" y="292" fill="#4a5560" font-size="9" text-anchor="middle">7</text>
      </g>
      <g transform="translate(484,0)">
        <rect x="0" y="44" width="42" height="206" rx="4" fill="#0a0c0f" stroke="#1c2127"/>
        <rect x="0" y="70" width="42" height="180" rx="4" fill="#39ffb0" fill-opacity="0.8"/>
        <circle cx="21" cy="270" r="6" fill="#39ffb0"/><text x="21" y="292" fill="#9fb0aa" font-size="9" text-anchor="middle">8</text>
      </g>
      <g transform="translate(550,0)">
        <rect x="0" y="44" width="42" height="206" rx="4" fill="#0a0c0f" stroke="#1c2127"/>
        <rect x="0" y="190" width="42" height="60" rx="4" fill="#39ffb0" fill-opacity="0.8"/>
        <circle cx="21" cy="270" r="6" fill="#39ffb0"/><text x="21" y="292" fill="#9fb0aa" font-size="9" text-anchor="middle">9</text>
      </g>
      <g transform="translate(616,0)">
        <rect x="0" y="44" width="42" height="206" rx="4" fill="#0a0c0f" stroke="#1c2127"/>
        <rect x="0" y="120" width="42" height="130" rx="4" fill="#39ffb0" fill-opacity="0.8"/>
        <circle cx="21" cy="270" r="6" fill="#39ffb0"/><text x="21" y="292" fill="#9fb0aa" font-size="9" text-anchor="middle">10</text>
      </g>
      <g transform="translate(682,0)">
        <rect x="0" y="44" width="42" height="206" rx="4" fill="#0a0c0f" stroke="#1c2127"/>
        <rect x="0" y="86" width="42" height="164" rx="4" fill="#39ffb0" fill-opacity="0.8"/>
        <circle cx="21" cy="270" r="6" fill="#39ffb0"/><text x="21" y="292" fill="#9fb0aa" font-size="9" text-anchor="middle">11</text>
      </g>
      <!-- i=11 off -->
      <g transform="translate(748,0)">
        <rect x="0" y="44" width="42" height="206" rx="4" fill="#0a0c0f" stroke="#1c2127"/>
        <rect x="0" y="160" width="42" height="90" rx="4" fill="#2b3138"/>
        <circle cx="21" cy="270" r="6" fill="#2b3138" stroke="#4a5560"/><text x="21" y="292" fill="#4a5560" font-size="9" text-anchor="middle">12</text>
      </g>
      <g transform="translate(814,0)">
        <rect x="0" y="44" width="42" height="206" rx="4" fill="#0a0c0f" stroke="#1c2127"/>
        <rect x="0" y="134" width="42" height="116" rx="4" fill="#39ffb0" fill-opacity="0.8"/>
        <circle cx="21" cy="270" r="6" fill="#39ffb0"/><text x="21" y="292" fill="#9fb0aa" font-size="9" text-anchor="middle">13</text>
      </g>
      <g transform="translate(880,0)">
        <rect x="0" y="44" width="42" height="206" rx="4" fill="#0a0c0f" stroke="#1c2127"/>
        <rect x="0" y="158" width="42" height="92" rx="4" fill="#39ffb0" fill-opacity="0.8"/>
        <circle cx="21" cy="270" r="6" fill="#39ffb0"/><text x="21" y="292" fill="#9fb0aa" font-size="9" text-anchor="middle">14</text>
      </g>
      <g transform="translate(946,0)">
        <rect x="0" y="44" width="42" height="206" rx="4" fill="#0a0c0f" stroke="#1c2127"/>
        <rect x="0" y="78" width="42" height="172" rx="4" fill="#39ffb0" fill-opacity="0.8"/>
        <circle cx="21" cy="270" r="6" fill="#39ffb0"/><text x="21" y="292" fill="#9fb0aa" font-size="9" text-anchor="middle">15</text>
      </g>
      <g transform="translate(1012,0)">
