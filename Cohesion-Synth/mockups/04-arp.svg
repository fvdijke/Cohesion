  <!-- ===== bottom: held notes + options ===== -->
  <g transform="translate(12,578)">
    <rect width="1096" height="110" rx="7" fill="#0d0f12" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="16" y="26" fill="#5dcaa5" font-size="10" font-weight="bold" letter-spacing="1.2">GEHOUDEN AKKOORD</text>
    <!-- mini keyboard (2 octaves) -->
    <g transform="translate(16,36)">
      <!-- white keys -->
      <g fill="#1a1d22" stroke="#0a0c0f">
        <rect x="0" y="0" width="34" height="58" rx="3"/><rect x="34" y="0" width="34" height="58" rx="3"/><rect x="68" y="0" width="34" height="58" rx="3"/>
        <rect x="102" y="0" width="34" height="58" rx="3"/><rect x="136" y="0" width="34" height="58" rx="3"/><rect x="170" y="0" width="34" height="58" rx="3"/><rect x="204" y="0" width="34" height="58" rx="3"/>
        <rect x="238" y="0" width="34" height="58" rx="3"/><rect x="272" y="0" width="34" height="58" rx="3"/><rect x="306" y="0" width="34" height="58" rx="3"/>
        <rect x="340" y="0" width="34" height="58" rx="3"/><rect x="374" y="0" width="34" height="58" rx="3"/><rect x="408" y="0" width="34" height="58" rx="3"/><rect x="442" y="0" width="34" height="58" rx="3"/>
      </g>
      <!-- held white keys (C, E, G) -->
      <rect x="0" y="0" width="34" height="58" rx="3" fill="#39ffb0" fill-opacity="0.85"/>
      <rect x="68" y="0" width="34" height="58" rx="3" fill="#39ffb0" fill-opacity="0.85"/>
      <rect x="136" y="0" width="34" height="58" rx="3" fill="#39ffb0" fill-opacity="0.85"/>
      <!-- black keys -->
      <g fill="#07090b">
        <rect x="24" y="0" width="20" height="36" rx="2"/><rect x="58" y="0" width="20" height="36" rx="2"/>
        <rect x="126" y="0" width="20" height="36" rx="2"/><rect x="160" y="0" width="20" height="36" rx="2"/><rect x="194" y="0" width="20" height="36" rx="2"/>
        <rect x="262" y="0" width="20" height="36" rx="2"/><rect x="296" y="0" width="20" height="36" rx="2"/>
        <rect x="364" y="0" width="20" height="36" rx="2"/><rect x="398" y="0" width="20" height="36" rx="2"/><rect x="432" y="0" width="20" height="36" rx="2"/>
      </g>
    </g>
    <!-- options right -->
    <g text-anchor="middle" font-size="11">
      <text x="620" y="40" fill="#6c7a74" font-size="9" letter-spacing="1">NOTE ORDER</text>
      <rect x="560" y="48" width="120" height="28" rx="5" fill="#0e1013" stroke="#2b3138"/><text x="620" y="67" fill="#9fe1cb">As Played &#9662;</text>
      <text x="760" y="40" fill="#6c7a74" font-size="9" letter-spacing="1">STEP DIV</text>
      <rect x="700" y="48" width="120" height="28" rx="5" fill="#0e1013" stroke="#2b3138"/><text x="760" y="67" fill="#9fe1cb">1/16 &#9662;</text>
    </g>
    <g text-anchor="middle">
      <use href="#kn" x="890" y="60"/><text x="890" y="92" fill="#9fb0aa" font-size="9">GATE</text>
      <use href="#kn" x="970" y="60"/><text x="970" y="92" fill="#9fb0aa" font-size="9">VEL AMT</text>
      <use href="#kn" x="1050" y="60"/><text x="1050" y="92" fill="#9fb0aa" font-size="9">SLIDE</text>
    </g>
  </g>

  <text x="560" y="696" fill="#6c7a74" font-size="9" text-anchor="middle">COHESION - SYNTH · ARP · mockup (huisstijl) · programmeerbare step-sequencer · patroon-presets · swing &amp; slide</text>
</svg>
