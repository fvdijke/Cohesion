<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2f36"/><stop offset="1" stop-color="#15171b"/></linearGradient>
    <radialGradient id="kg" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#3a4149"/><stop offset="1" stop-color="#1b1f24"/></radialGradient>
    <symbol id="kn" overflow="visible">
      <circle r="17" fill="url(#kg)" stroke="#11161b" stroke-width="2"/><circle r="17" fill="none" stroke="#2b3138"/>
      <line x1="0" y1="0" x2="-9" y2="-14" stroke="#39ffb0" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="980" height="520" rx="10" fill="url(#bg)"/>
  <rect x="6" y="6" width="968" height="508" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- ===== header ===== -->
  <text x="24" y="40" fill="#ffffff" font-size="18" font-weight="bold" letter-spacing="2.2">COHESION - TRANSIENT</text>
  <text x="24" y="57" fill="#ffffff" fill-opacity="0.55" font-size="11" letter-spacing="1">by Pepperwood</text>
  <text x="380" y="55" fill="#6c7a74" font-size="10" letter-spacing="1">Transient Shaper</text>

  <text x="640" y="24" fill="#9fb0aa" font-size="10" letter-spacing="1.4" text-anchor="middle">PRESET</text>
  <rect x="520" y="30" width="24" height="30" rx="5" fill="#0e1013" stroke="#2b3138"/><text x="532" y="50" fill="#9fe1cb" font-size="13" text-anchor="middle">&#8249;</text>
  <rect x="548" y="30" width="184" height="30" rx="5" fill="#0e1013" stroke="#2b3138"/><text x="640" y="50" fill="#eafff6" font-size="13" text-anchor="middle">Punch Up</text>
  <rect x="736" y="30" width="24" height="30" rx="5" fill="#0e1013" stroke="#2b3138"/><text x="748" y="50" fill="#9fe1cb" font-size="13" text-anchor="middle">&#8250;</text>
  <rect x="766" y="30" width="30" height="30" rx="5" fill="#0e1013" stroke="#2b3138"/><text x="781" y="50" fill="#9fe1cb" font-size="12" text-anchor="middle">&#128190;</text>
  <!-- out meter -->
  <text x="916" y="26" fill="#9fb0aa" font-size="9" text-anchor="middle">OUT</text>
  <rect x="902" y="30" width="7" height="34" rx="2" fill="#0e1013"/><rect x="902" y="44" width="7" height="20" rx="2" fill="#39ffb0"/>
  <rect x="914" y="30" width="7" height="34" rx="2" fill="#0e1013"/><rect x="914" y="46" width="7" height="18" rx="2" fill="#39ffb0"/>

  <!-- ===== transient display ===== -->
  <g transform="translate(12,74)">
    <rect width="956" height="266" rx="7" fill="#0d0f12" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="16" y="24" fill="#5dcaa5" font-size="10.5" font-weight="bold" letter-spacing="1.4">TRANSIENT SHAPING</text>

    <!-- legend -->
    <rect x="800" y="14" width="16" height="2" fill="#ffffff" fill-opacity="0.35"/><text x="822" y="19" fill="#9fb0aa" font-size="9.5">input</text>
    <rect x="862" y="14" width="16" height="2" fill="#39ffb0"/><text x="884" y="19" fill="#9fb0aa" font-size="9.5">shaped</text>

    <!-- grid -->
    <g stroke="#ffffff" stroke-opacity="0.05"><line x1="20" y1="90" x2="936" y2="90"/><line x1="20" y1="222" x2="936" y2="222"/></g>
    <line x1="20" y1="156" x2="936" y2="156" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- input transients (grey) -->
    <path d="M20,156 L150,156 L156,70 L300,152 L320,156 L440,156 L446,74 L590,152 L610,156 L720,156 L726,66 L860,151 L936,156"
          fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.4" stroke-linejoin="round"/>

    <!-- shaped output (teal): taller attacks, tighter sustain -->
    <path d="M20,156 L150,156 L155,36 L250,154 L320,156 L440,156 L445,42 L545,154 L610,156 L720,156 L725,30 L820,153 L936,156"
          fill="none" stroke="#39ffb0" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M20,156 L150,156 L155,36 L250,154 L320,156 L440,156 L445,42 L545,154 L610,156 L720,156 L725,30 L820,153 L936,156 L936,276 L20,276 Z"
          fill="#39ffb0" fill-opacity="0.06"/>

    <!-- attack / sustain annotations -->
    <line x1="150" y1="44" x2="150" y2="150" stroke="#39ffb0" stroke-opacity="0.25" stroke-dasharray="3 3"/>
    <text x="160" y="52" fill="#39ffb0" font-size="9">ATTACK &#8593;</text>
    <text x="210" y="140" fill="#5ad0ff" font-size="9">SUSTAIN</text>
    <path d="M205,146 C230,150 250,150 260,152" fill="none" stroke="#5ad0ff" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- freq/time axis hint -->
    <text x="476" y="258" fill="#6c7a74" font-size="9" text-anchor="middle">tijd &#8594;</text>
  </g>

  <!-- ===== four controls ===== -->
  <!-- helper: dim 270deg track + teal arc + pointer + value, drawn per knob -->
  <!-- ATTACK -->
  <g>
    <circle cx="160" cy="410" r="40" fill="url(#kg)" stroke="#11161b" stroke-width="2"/>
    <circle cx="160" cy="410" r="40" fill="none" stroke="#2b3138"/>
    <path d="M131.72,438.28 A40,40 0 1 1 188.28,438.28" fill="none" stroke="#2a2f35" stroke-width="3"/>
    <path d="M131.72,438.28 A40,40 0 1 1 192.36,386.49" fill="none" stroke="#39ffb0" stroke-width="3" stroke-linecap="round"/>
    <line x1="160" y1="410" x2="184.3" y2="392.4" stroke="#dfe6e2" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="160" y1="366" x2="160" y2="372" stroke="#6c7a74" stroke-width="1.5"/>
    <text x="160" y="476" fill="#9fb0aa" font-size="12" font-weight="bold" letter-spacing="1" text-anchor="middle">ATTACK</text>
    <text x="160" y="494" fill="#9fe1cb" font-size="11" text-anchor="middle">+4.0 dB</text>
  </g>
  <!-- SUSTAIN -->
  <g>
    <circle cx="395" cy="410" r="40" fill="url(#kg)" stroke="#11161b" stroke-width="2"/>
    <circle cx="395" cy="410" r="40" fill="none" stroke="#2b3138"/>
    <path d="M366.72,438.28 A40,40 0 1 1 423.28,438.28" fill="none" stroke="#2a2f35" stroke-width="3"/>
    <path d="M366.72,438.28 A40,40 0 0 1 372.77,376.74" fill="none" stroke="#39ffb0" stroke-width="3" stroke-linecap="round"/>
    <line x1="395" y1="410" x2="378.33" y2="385.06" stroke="#dfe6e2" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="395" y1="366" x2="395" y2="372" stroke="#6c7a74" stroke-width="1.5"/>
    <text x="395" y="476" fill="#9fb0aa" font-size="12" font-weight="bold" letter-spacing="1" text-anchor="middle">SUSTAIN</text>
    <text x="395" y="494" fill="#9fe1cb" font-size="11" text-anchor="middle">-2.5 dB</text>
  </g>
  <!-- SENSITIVITY -->
  <g>
    <circle cx="630" cy="410" r="40" fill="url(#kg)" stroke="#11161b" stroke-width="2"/>
    <circle cx="630" cy="410" r="40" fill="none" stroke="#2b3138"/>
    <path d="M601.72,438.28 A40,40 0 1 1 658.28,438.28" fill="none" stroke="#2a2f35" stroke-width="3"/>
    <path d="M601.72,438.28 A40,40 0 0 1 655.98,379.58" fill="none" stroke="#39ffb0" stroke-width="3" stroke-linecap="round"/>
    <line x1="630" y1="410" x2="649.48" y2="387.19" stroke="#dfe6e2" stroke-width="2.5" stroke-linecap="round"/>
    <text x="630" y="476" fill="#9fb0aa" font-size="12" font-weight="bold" letter-spacing="1" text-anchor="middle">SENSITIVITY</text>
    <text x="630" y="494" fill="#9fe1cb" font-size="11" text-anchor="middle">65 %</text>
  </g>
  <!-- OUTPUT -->
  <g>
    <circle cx="865" cy="410" r="40" fill="url(#kg)" stroke="#11161b" stroke-width="2"/>
    <circle cx="865" cy="410" r="40" fill="none" stroke="#2b3138"/>
    <path d="M836.72,438.28 A40,40 0 1 1 893.28,438.28" fill="none" stroke="#2a2f35" stroke-width="3"/>
    <path d="M836.72,438.28 A40,40 0 0 1 874.34,371.11" fill="none" stroke="#39ffb0" stroke-width="3" stroke-linecap="round"/>
    <line x1="865" y1="410" x2="872.0" y2="380.83" stroke="#dfe6e2" stroke-width="2.5" stroke-linecap="round"/>
    <text x="865" y="476" fill="#9fb0aa" font-size="12" font-weight="bold" letter-spacing="1" text-anchor="middle">OUTPUT</text>
    <text x="865" y="494" fill="#9fe1cb" font-size="11" text-anchor="middle">+1.5 dB</text>
  </g>

  <text x="490" y="512" fill="#6c7a74" font-size="9" text-anchor="middle">COHESION - TRANSIENT · Transient Shaper · mockup (huisstijl)</text>
</svg>
