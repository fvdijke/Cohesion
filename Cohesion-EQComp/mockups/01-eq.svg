<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2f36"/><stop offset="1" stop-color="#15171b"/></linearGradient>
    <radialGradient id="kg" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#3a4149"/><stop offset="1" stop-color="#1b1f24"/></radialGradient>
    <symbol id="kn" overflow="visible"><circle r="15" fill="url(#kg)" stroke="#11161b" stroke-width="2"/><circle r="15" fill="none" stroke="#2b3138"/><line x1="0" y1="0" x2="-7.5" y2="-11.5" stroke="#39ffb0" stroke-width="2.2" stroke-linecap="round"/></symbol>
  </defs>
  <rect x="0" y="0" width="980" height="640" rx="10" fill="url(#bg)"/>
  <rect x="6" y="6" width="968" height="628" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- header -->
  <text x="22" y="40" fill="#ffffff" font-size="18" font-weight="bold" letter-spacing="2.2">COHESION - EQ/COMP</text>
  <text x="22" y="57" fill="#ffffff" fill-opacity="0.55" font-size="11" letter-spacing="1">by Pepperwood</text>
  <g font-size="12" font-weight="bold" letter-spacing="1" text-anchor="middle">
    <rect x="305" y="26" width="118" height="30" rx="6" fill="#0f6e56"/><text x="364" y="46" fill="#eafff6">EQ</text>
    <rect x="431" y="26" width="118" height="30" rx="6" fill="#0e1013" stroke="#2b3138"/><text x="490" y="46" fill="#9fb0aa">MULTIBAND</text>
    <rect x="557" y="26" width="118" height="30" rx="6" fill="#0e1013" stroke="#2b3138"/><text x="616" y="46" fill="#9fb0aa">ASSIST</text>
  </g>
  <!-- right: IN / OUT / ON -->
  <g text-anchor="middle">
    <use href="#kn" x="812" y="41"/><text x="812" y="64" fill="#9fb0aa" font-size="8">IN</text>
    <use href="#kn" x="856" y="41"/><text x="856" y="64" fill="#9fb0aa" font-size="8">OUT</text>
  </g>
  <rect x="896" y="26" width="54" height="26" rx="6" fill="#0f6e56"/><text x="923" y="44" fill="#eafff6" font-size="11" font-weight="bold" text-anchor="middle">ON</text>

  <!-- ===== EQ curve ===== -->
  <g transform="translate(8,72)">
    <rect width="964" height="398" rx="7" fill="#0d0f12" stroke="#ffffff" stroke-opacity="0.08"/>
    <!-- grid -->
    <g stroke="#ffffff" stroke-opacity="0.05">
      <line x1="40" y1="100" x2="924" y2="100"/><line x1="40" y1="199" x2="924" y2="199"/><line x1="40" y1="298" x2="924" y2="298"/>
    </g>
    <line x1="40" y1="199" x2="924" y2="199" stroke="#ffffff" stroke-opacity="0.12"/>
    <!-- before (grey) -->
    <path d="M40,330 C180,300 300,250 430,230 C560,210 700,250 820,280 C870,292 900,300 924,305 L924,360 L40,360 Z" fill="#ffffff" fill-opacity="0.06"/>
    <path d="M40,330 C180,300 300,250 430,230 C560,210 700,250 820,280 C870,292 900,300 924,305" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <!-- after (teal) -->
    <path d="M40,340 C180,315 300,255 430,235 C560,214 700,245 820,260 C870,268 900,276 924,280 L924,360 L40,360 Z" fill="#39ffb0" fill-opacity="0.12"/>
    <!-- EQ response curve -->
    <path d="M40,210 C120,210 150,150 210,150 C260,150 280,210 340,220 C420,232 470,120 540,120 C610,120 640,210 720,214 C800,218 860,250 924,250" fill="none" stroke="#39ffb0" stroke-width="2.4"/>
    <!-- nodes -->
    <g>
      <circle cx="175" cy="150" r="10" fill="#0f6e56" stroke="#9fe1cb"/><text x="175" y="154" fill="#eafff6" font-size="11" font-weight="bold" text-anchor="middle">H</text>
      <circle cx="315" cy="214" r="10" fill="#0f6e56" stroke="#9fe1cb"/><text x="315" y="218" fill="#eafff6" font-size="11" font-weight="bold" text-anchor="middle">1</text>
      <circle cx="505" cy="120" r="10" fill="#39ffb0" stroke="#ffffff" stroke-width="2"/><text x="505" y="124" fill="#07130f" font-size="11" font-weight="bold" text-anchor="middle">2</text>
      <circle cx="720" cy="214" r="10" fill="#0f6e56" stroke="#9fe1cb"/><text x="720" y="218" fill="#eafff6" font-size="11" font-weight="bold" text-anchor="middle">3</text>
      <circle cx="880" cy="250" r="10" fill="#0f6e56" stroke="#9fe1cb"/><text x="880" y="254" fill="#eafff6" font-size="11" font-weight="bold" text-anchor="middle">L</text>
    </g>
    <!-- freq axis -->
    <g fill="#6c7a74" font-size="9" text-anchor="middle"><text x="110" y="378">50</text><text x="230" y="378">200</text><text x="400" y="378">1k</text><text x="560" y="378">2k</text><text x="760" y="378">10k</text></g>
    <!-- dB axis -->
    <g fill="#6c7a74" font-size="9"><text x="928" y="104">+12</text><text x="928" y="203">0</text><text x="928" y="302">-12</text></g>
  </g>

  <!-- ===== band toggles ===== -->
  <g transform="translate(8,482)" font-size="11" text-anchor="middle">
    <rect width="964" height="40" rx="7" fill="#0d0f12" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="16" y="8" width="70" height="24" rx="5" fill="#12201b" stroke="#0f6e56"/><circle cx="30" cy="20" r="4" fill="#39ffb0"/><text x="58" y="24" fill="#eafff6">HPF</text>
    <rect x="130" y="8" width="96" height="24" rx="5" fill="#12201b" stroke="#0f6e56"/><circle cx="144" cy="20" r="4" fill="#39ffb0"/><text x="182" y="24" fill="#eafff6">BAND 1</text>
    <rect x="234" y="8" width="96" height="24" rx="5" fill="#12201b" stroke="#0f6e56"/><circle cx="248" cy="20" r="4" fill="#39ffb0"/><text x="286" y="24" fill="#eafff6">BAND 2</text>
    <rect x="338" y="8" width="96" height="24" rx="5" fill="#12201b" stroke="#0f6e56"/><circle cx="352" cy="20" r="4" fill="#39ffb0"/><text x="390" y="24" fill="#eafff6">BAND 3</text>
    <rect x="442" y="8" width="96" height="24" rx="5" fill="#0e1013" stroke="#2b3138"/><circle cx="456" cy="20" r="4" fill="#2b3138" stroke="#4a5560"/><text x="494" y="24" fill="#9fb0aa">BAND 4</text>
    <rect x="546" y="8" width="96" height="24" rx="5" fill="#0e1013" stroke="#2b3138"/><circle cx="560" cy="20" r="4" fill="#2b3138" stroke="#4a5560"/><text x="598" y="24" fill="#9fb0aa">BAND 5</text>
    <rect x="650" y="8" width="96" height="24" rx="5" fill="#0e1013" stroke="#2b3138"/><circle cx="664" cy="20" r="4" fill="#2b3138" stroke="#4a5560"/><text x="702" y="24" fill="#9fb0aa">BAND 6</text>
    <rect x="878" y="8" width="70" height="24" rx="5" fill="#12201b" stroke="#0f6e56"/><circle cx="892" cy="20" r="4" fill="#39ffb0"/><text x="920" y="24" fill="#eafff6">LPF</text>
  </g>

  <!-- ===== selected band controls ===== -->
  <g transform="translate(8,530)">
    <rect width="964" height="96" rx="7" fill="#0d0f12" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="16" y="26" fill="#5dcaa5" font-size="10.5" font-weight="bold" letter-spacing="1.2">BAND 2</text>
    <g>
      <text x="150" y="40" fill="#9fb0aa" font-size="10" text-anchor="middle">FREQ</text>
      <rect x="60" y="48" width="180" height="6" rx="3" fill="#13181d"/><rect x="60" y="48" width="96" height="6" rx="3" fill="#39ffb0"/><text x="150" y="74" fill="#9fe1cb" font-size="10" text-anchor="middle">1.00 kHz</text>
      <text x="370" y="40" fill="#9fb0aa" font-size="10" text-anchor="middle">GAIN</text>
      <rect x="280" y="48" width="180" height="6" rx="3" fill="#13181d"/><rect x="280" y="48" width="140" height="6" rx="3" fill="#39ffb0"/><text x="370" y="74" fill="#9fe1cb" font-size="10" text-anchor="middle">+6.0 dB</text>
      <text x="590" y="40" fill="#9fb0aa" font-size="10" text-anchor="middle">Q</text>
      <rect x="500" y="48" width="180" height="6" rx="3" fill="#13181d"/><rect x="500" y="48" width="70" height="6" rx="3" fill="#39ffb0"/><text x="590" y="74" fill="#9fe1cb" font-size="10" text-anchor="middle">1.4</text>
    </g>
    <text x="820" y="40" fill="#9fb0aa" font-size="10" text-anchor="middle">TYPE</text>
    <rect x="740" y="48" width="200" height="28" rx="5" fill="#0e1013" stroke="#2b3138"/><text x="756" y="67" fill="#eafff6" font-size="12">Bell</text><text x="928" y="67" fill="#9fe1cb" font-size="11" text-anchor="end">&#9662;</text>
  </g>

  <circle cx="952" cy="612" r="14" fill="#15181c" stroke="#0f6e56" stroke-width="1.6"/><text x="952" y="617" fill="#9fe1cb" font-size="15" font-weight="bold" text-anchor="middle">?</text>
</svg>
